<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#16243b;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}
.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}
header{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:grid;place-items:center;background:#14263f;color:#fff;width:44px;height:44px;border-radius:13px;font-size:28px}
h1{font-size:20px;margin:0}header p{margin:2px 0 0;color:#53647a;font-size:13px}
button{font:inherit;border:0;border-radius:10px;cursor:pointer}
.reload{background:#e3e9f2;color:#14263f;padding:9px 12px;font-size:14px}
#status{min-height:20px;margin:12px 2px;font-size:13px;color:#53647a}
#status.err{color:#a32828}
.summary{display:flex;justify-content:space-between;align-items:center;background:#14263f;color:#fff;border-radius:18px;padding:16px 18px}
.summary h2{margin:2px 0;font-size:19px}.summary p{margin:0;font-size:13px;opacity:.85}
.eyebrow{font-size:12px;opacity:.8}
.ring{width:56px;height:56px;border-radius:50%;border:4px solid #7fb2ff;display:grid;place-items:center;font-size:20px;font-weight:700}
.bar{display:flex;gap:8px;margin:14px 0 10px;align-items:center}
.tabs{display:flex;flex:1;background:#e3e9f2;border-radius:12px;padding:3px}
.tabs button{flex:1;background:none;padding:9px 0;color:#53647a;font-size:14px}
.tabs button.active{background:#fff;color:#14263f;font-weight:700;box-shadow:0 1px 3px #0002}
select{font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid #cdd6e3;background:#fff}
.group{font-size:13px;color:#53647a;margin:16px 4px 6px;font-weight:700}
.task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px #0001}
.task input{width:26px;height:26px;flex:none;accent-color:#14263f}
.info{flex:1;min-width:0}
.name{font-size:16px;line-height:1.35;word-break:break-word}
.meta{font-size:12px;color:#6a7a8f;margin-top:3px}
.memo{font-size:12px;color:#8592a3;margin-top:2px}
.is-done .name{text-decoration:line-through;color:#8a97a8}
.pri{flex:none;font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid #cdd6e3;background:#f5f7fb}
.pri.p4{background:#14263f;color:#fff;border-color:#14263f}
.pri.p3{border-color:#14263f;font-weight:700}
.late{color:#a32828;font-weight:700}
.empty{text-align:center;color:#8592a3;padding:30px 0}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand"><span class="logo">ρ</span>
      <div><h1>RHO ToDo</h1><p>今日やることを、ひと目で。</p></div></div>
    <button class="reload" id="reload">↻ 更新</button>
  </header>
  <div id="status">読み込み中…</div>
  <section class="summary">
    <div><span class="eyebrow" id="todayLabel"></span><h2>今日のToDo</h2><p id="progress">–</p></div>
    <div class="ring" id="ring">–</div>
  </section>
  <div class="bar">
    <nav class="tabs">
      <button data-f="today" class="active">今日</button>
      <button data-f="all">すべて</button>
      <button data-f="done">完了</button>
    </nav>
    <select id="sort" aria-label="並べ替え">
      <option value="priority">優先度順</option>
      <option value="due">期限順</option>
    </select>
  </div>
  <section id="list"></section>
</main>
<script>
var data = null, filter = 'today', busy = false, prev = {};
var PRI = {'最優先':4,'高':3,'中':2,'低':1};
function $(id){return document.getElementById(id);}
function show(msg, err){var s=$('status');s.textContent=msg||'';s.className=err?'err':'';}

function load(){
  show('読み込み中…');
  google.script.run.withSuccessHandler(function(d){data=d;render();show('スプレッドシートと同期しました（'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'）');})
    .withFailureHandler(function(e){show('読み込みエラー：'+e.message,true);}).getData();
}

function isDone(t){return t.status==='完了';}
function cmp(a,b){
  var s=$('sort').value;
  var pa=PRI[a.priority]||0,pb=PRI[b.priority]||0;
  var da=a.due||'9999',db=b.due||'9999';
  if(s==='due') return da<db?-1:da>db?1:pb-pa;
  return pb-pa || (da<db?-1:da>db?1:0);
}

function render(){
  if(!data) return;
  var t=data.today;
  $('todayLabel').textContent=new Date(t+'T12:00:00+09:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  var tasks=data.tasks, rts=data.routines;
  var todayTasks=tasks.filter(function(x){return !isDone(x)&&(!x.due||x.due<=t);});
  var left=todayTasks.length+rts.filter(function(x){return !isDone(x);}).length;
  var doneToday=rts.filter(isDone).length;
  $('progress').textContent='未完了 '+left+'件 ・ 日課の完了 '+doneToday+'/'+rts.length;
  $('ring').textContent=left;

  var groups=[];
  if(filter==='today'){
    groups.push(['単発タスク（期限が今日まで・期限なし）',todayTasks.sort(cmp)]);
    groups.push(['日課（毎日）',rts.slice().sort(cmp)]);
  }else if(filter==='all'){
    groups.push(['未完了',tasks.filter(function(x){return !isDone(x);}).sort(cmp)]);
    groups.push(['完了済み',tasks.filter(isDone).sort(cmp)]);
  }else{
    groups.push(['完了済みタスク',tasks.filter(isDone).sort(cmp)]);
    groups.push(['今日完了した日課',rts.filter(isDone)]);
  }

  var list=$('list');list.innerHTML='';
  groups.forEach(function(g){
    if(!g[1].length) return;
    var h=document.createElement('div');h.className='group';h.textContent=g[0]+'　'+g[1].length+'件';list.appendChild(h);
    g[1].forEach(function(x){list.appendChild(row(x,t));});
  });
  if(!list.children.length){list.innerHTML='<div class="empty">該当するタスクはありません 🎉</div>';}
}

function row(x,t){
  var el=document.createElement('article');el.className='task'+(isDone(x)?' is-done':'');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=isDone(x);cb.disabled=busy;
  cb.setAttribute('aria-label',x.name+'を完了にする');
  cb.onchange=function(){toggle(x,cb.checked);};
  var info=document.createElement('div');info.className='info';
  var n=document.createElement('div');n.className='name';n.textContent=x.name;
  var m=document.createElement('div');m.className='meta';
  var parts=[x.area, x.routine?'日課':'', x.due?('期限 '+x.due):'', x.status, x.minutes?(x.minutes+'分'):''].filter(Boolean);
  m.textContent=parts.join(' · ');
  if(!x.routine&&x.due&&x.due<t&&!isDone(x)){var l=document.createElement('span');l.className='late';l.textContent=' · 期限切れ';m.appendChild(l);}
  info.appendChild(n);info.appendChild(m);
  if(x.memo){var me=document.createElement('div');me.className='memo';me.textContent=x.memo;info.appendChild(me);}
  var p=document.createElement('span');var pv=PRI[x.priority]||0;p.className='pri p'+pv;p.textContent=x.priority||'通常';
  el.appendChild(cb);el.appendChild(info);el.appendChild(p);
  return el;
}

function toggle(x,done){
  if(busy) return; busy=true; render();
  show('保存中…');
  var r=google.script.run.withSuccessHandler(function(d){busy=false;data=d;render();show(x.name+' → '+(done?'完了':'戻しました'));})
    .withFailureHandler(function(e){busy=false;render();show('保存できませんでした：'+e.message,true);});
  if(x.routine) r.setRoutineDone(x.id,done);
  else { if(done) prev[x.id]=x.status; r.setTaskDone(x.id,done,done?x.status:(prev[x.id]||'未着手')); }
}

document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick=function(){filter=b.dataset.f;document.querySelectorAll('.tabs button').forEach(function(o){o.classList.toggle('active',o===b);});render();};
});
$('sort').onchange=render;
$('reload').onclick=load;
load();
</script>
</body>
</html>
