<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14263f">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RHO ToDo">
  <title>RHO ToDo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <span class="logo">ρ</span>
        <div><h1>RHO ToDo</h1><p>今日やることを、ひと目で。</p></div>
      </div>
      <button id="reload" class="subtle">↻ 更新</button>
    </header>

    <form id="login" class="login" hidden>
      <label for="key">合言葉</label>
      <div class="form">
        <input id="key" type="password" autocomplete="current-password" placeholder="合言葉を入力">
        <button type="submit">開く</button>
      </div>
      <p class="hint">この端末にだけ保存されます。</p>
    </form>

    <div id="status" role="status" aria-live="polite">読み込み中…</div>

    <div id="app" hidden>
      <section class="summary">
        <div><span class="eyebrow" id="todayLabel"></span><h2>今日のToDo</h2><p id="progress">–</p></div>
        <div class="ring" id="ring">–</div>
      </section>

      <div class="bar">
        <nav class="tabs" aria-label="表示の切り替え">
          <button data-f="today" class="active">今日</button>
          <button data-f="tasks">タスク</button>
          <button data-f="youtube">YouTube</button>
          <button data-f="study">勉強</button>
          <button data-f="shop">買い物</button>
        </nav>
        <div class="sortrow" id="sortRow">
          <select id="sort" aria-label="並べ替え">
            <option value="priority">優先度順</option>
            <option value="due">期限順</option>
          </select>
        </div>
      </div>

      <section id="list" aria-label="一覧"></section>

      <form id="cmdForm" class="composer">
        <div class="form">
          <input id="cmd" autocomplete="off" placeholder="">
          <button type="submit" id="cmdSend">送信</button>
        </div>
        <p class="hint" id="cmdHint"></p>
      </form>

      <footer><button id="logout" type="button" class="link">この端末の合言葉を消す</button></footer>
    </div>
  </main>
</body>
</html>
